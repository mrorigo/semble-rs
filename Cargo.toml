[package]
name = "semble-rs"
version = "0.1.2"
edition = "2024"
description = "Fast native Rust semantic code search and AST retrieval MCP server"
license = "MIT"
readme = "README.md"
repository = "https://github.com/mrorigo/semble-rs"
homepage = "https://github.com/mrorigo/semble-rs"
documentation = "https://docs.rs/semble-rs"
keywords = ["mcp", "code-search", "semantic-search", "bm25", "tree-sitter"]
categories = ["command-line-utilities", "development-tools"]
exclude = [
    "assets/model/embeddings.bin",
    "assets/model/weights.bin",
    "assets/model/tokenizer.json",
    "assets/model/manifest.json",
    "assets/model/*.download",
    "PUBLISH_PLAN.md",
    ".github",
]

[lib]
name = "semble_rs"
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
chrono = { version = "0.4", features = ["clock", "serde"] }
once_cell = "1.21"
rayon = "1.10"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rust-mcp-sdk = "0.9.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.13"
model2vec-rs = "0.2.1"
tree-sitter = "0.26"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-md = { version = "0.5", features = ["parser"] }
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
walkdir = "2.5"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "bench_chunking"
harness = false

[[bench]]
name = "bench_indexing"
harness = false

[[bench]]
name = "bench_search"
harness = false

