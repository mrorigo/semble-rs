name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
            archive: tar.gz
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-musl
            ext: ""
            archive: tar.gz
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            ext: ""
            archive: tar.gz
          - runner: macos-latest
            target: aarch64-apple-darwin
            ext: ""
            archive: tar.gz
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
            archive: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Zig (musl cross builds)
        if: contains(matrix.target, 'musl')
        uses: goto-bus-stop/setup-zig@v2

      - name: Install cargo-zigbuild (musl cross builds)
        if: contains(matrix.target, 'musl')
        shell: bash
        run: cargo install cargo-zigbuild --locked

      - name: Build semble
        if: ${{ !contains(matrix.target, 'musl') }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build semble (musl)
        if: contains(matrix.target, 'musl')
        run: cargo zigbuild --release --target ${{ matrix.target }}

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          BIN="target/${{ matrix.target }}/release/semble-rs${{ matrix.ext }}"
          OUT="dist/semble-rs-${{ matrix.target }}.tar.gz"
          tar -C "$(dirname "$BIN")" -czf "$OUT" "$(basename "$BIN")"
          shasum -a 256 "$OUT" > "dist/semble-rs-${{ matrix.target }}.tar.gz.sha256"

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $bin = "target/${{ matrix.target }}/release/semble-rs${{ matrix.ext }}"
          $out = "dist/semble-rs-${{ matrix.target }}.zip"
          Compress-Archive -Path $bin -DestinationPath $out -Force
          $hash = (Get-FileHash -Algorithm SHA256 $out).Hash.ToLower()
          "$hash  semble-rs-${{ matrix.target }}.zip" | Out-File -Encoding ascii "dist/semble-rs-${{ matrix.target }}.zip.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: semble-rs-${{ matrix.target }}
          path: dist/

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Verify release artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          expected=(
            "semble-rs-aarch64-apple-darwin.tar.gz"
            "semble-rs-aarch64-apple-darwin.tar.gz.sha256"
            "semble-rs-aarch64-unknown-linux-gnu.tar.gz"
            "semble-rs-aarch64-unknown-linux-gnu.tar.gz.sha256"
            "semble-rs-aarch64-unknown-linux-musl.tar.gz"
            "semble-rs-aarch64-unknown-linux-musl.tar.gz.sha256"
            "semble-rs-x86_64-pc-windows-msvc.zip"
            "semble-rs-x86_64-pc-windows-msvc.zip.sha256"
            "semble-rs-x86_64-unknown-linux-gnu.tar.gz"
            "semble-rs-x86_64-unknown-linux-gnu.tar.gz.sha256"
          )

          for artifact_dir in dist/*; do
            [ -d "$artifact_dir" ] || continue
            for file in "$artifact_dir"/*; do
              [ -f "$file" ] || continue
              cp "$file" out/
            done
          done

          for name in "${expected[@]}"; do
            if [ ! -f "out/$name" ]; then
              echo "missing expected release artifact: $name" >&2
              exit 1
            fi
          done

          actual_count=$(find out -maxdepth 1 -type f | wc -l | tr -d ' ')
          if [ "$actual_count" -ne 10 ]; then
            echo "expected 10 release files, found $actual_count" >&2
            ls -la out
            exit 1
          fi

          ls -la out

      - name: Create checksums bundle
        shell: bash
        run: |
          set -euo pipefail
          cd out
          sort *.sha256 | xargs cat > checksums.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*
          generate_release_notes: true
